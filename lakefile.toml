name = "quadratic-algebras"
version = "0.1.0"
defaultTargets = ["QuadraticAlgebras", "QuadraticAlgebrasTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e37d88a26f3791ed5a93daa1f949af1021b8d103"

[[lean_lib]]
name = "QuadraticAlgebras"

[[lean_lib]]
name = "QuadraticAlgebrasTest"
globs = ["QuadraticAlgebrasTest.+"]
