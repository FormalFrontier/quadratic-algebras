version: "v0.4"
project:
  name: quadratic-algebras
  description: >-
    Quadratic-algebra presentations and total fraction rings, squarefree
    integral-closure criteria, diagonal quadratics, real-closed
    negative-discriminant witnesses and chosen quadratic coordinates, and the
    class number of the number field generated by a square root of minus five.
    For any real-closed field R, QuadraticAlgebra R (-1) 0 is algebraically
    closed and irreducible polynomials over R have degree at most two. Its
    irreducible nonlinear polynomial quotients admit noncanonical algebra
    equivalences with this quadratic field.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
