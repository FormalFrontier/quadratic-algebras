version: "v0.4"
project:
  name: quadratic-algebras
  description: >-
    Quadratic-algebra presentations and total fraction rings, squarefree
    integral-closure criteria, diagonal quadratics, real-closed
    negative-discriminant witnesses and chosen quadratic coordinates, and the
    class number of the number field generated by a square root of minus five.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Quadratic algebras, integral closure, diagonal forms and arithmetic of minus five
    type: original-proof
    relationship: formalizes
    note: >-
      Original Formal Frontier Lean proofs of the stated results using imported
      Mathlib APIs. See the README references for mathematical motivation and
      prior formalizations.
automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and pinned Mathlib to develop proofs,
        documentation and downstream examples.
  notes: >-
    AI agents contributed mathematical proofs, module and client migration,
    and documentation.
status:
  scope: >-
    The canonical quadratic-algebra quotient bridge, scalar-extension
    presentations and total fraction rings allow arbitrary commutative rings.
    Over a real-closed field, irreducibility of the defining quadratic gives
    a nonzero square root of its negative discriminant. Over any field with
    nonzero two, a supplied nonzero element whose square is the negative
    discriminant gives chosen coordinates, with no preferred sign. The chosen
    AdjoinRoot coordinates additionally require a monic polynomial of natural
    degree two; they are not arbitrary-commutative-ring or higher-degree
    quotient presentations. Integral-closure criteria retain the stated
    domain, UFD, invertible-two or integer congruence hypotheses. Diagonal
    irreducibility and squarefreeness retain field and nonzero-two assumptions.
    The concrete minus-five development proves nonunique factorization,
    the ring-of-integers identification, discriminant minus twenty and class
    number two. No general classification of quadratic forms or number fields,
    or complete formalization of a mathematical source, is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
