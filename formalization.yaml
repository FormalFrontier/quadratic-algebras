version: "v0.4"
project:
  name: quadratic-algebras
  description: >-
    Quadratic-algebra presentations and total fraction rings, squarefree
    integral-closure criteria, diagonal quadratics, and the class number of
    the number field generated by a square root of minus five.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Quadratic algebras, integral closure, diagonal forms and arithmetic of minus five
    type: original-proof
    relationship: formalizes
    note: >-
      Original project Lean theory and proofs contributed by Atlas, using
      separately authored mathlib APIs as declared dependencies. Worker A's
      native-module and stored-client migration, followed by Atlas's
      module-documentation placement repair, is later assembly rather than
      the origin of the mathematical proof expression. Atlas supplied the
      standalone guide, additional named README clients, metadata and generated
      API documentation. The original mathematical sources and dependency
      pins are preserved.
automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and mathlib with pinned revisions,
        public imports, downstream examples and independent project reviews.
  notes: >-
    Atlas authored the original project theory and this documentation;
    later agents assembled native interfaces and private test clients.
    No model or cost measurements are claimed. The README reports a measured
    cached-dependency source-build baseline and its limitations.
status:
  scope: >-
    Quotient and scalar-extension presentations and total fraction rings allow
    arbitrary commutative rings. Integral-closure criteria retain the stated
    domain, UFD, invertible-two or integer congruence hypotheses. Diagonal
    irreducibility and squarefreeness retain field and nonzero-two assumptions.
    The concrete minus-five development proves nonunique factorization,
    the ring-of-integers identification, discriminant minus twenty and class
    number two. No general classification of quadratic forms or number fields,
    or complete formalization of a mathematical source, is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: QuadraticAlgebra.equivAdjoinRoot
      file: QuadraticAlgebras/AdjoinRoot.lean
    - declaration: QuadraticAlgebra.fractionRingEquivBaseChange
      file: QuadraticAlgebras/FractionRing.lean
    - declaration: IsFractionRing.isInteger_of_sq_mul_squarefree
      file: QuadraticAlgebras/Squarefree.lean
    - declaration: QuadraticAlgebra.isIntegrallyClosed_iff_squarefree
      file: QuadraticAlgebras/IntegralClosureCriterion.lean
    - declaration: QuadraticAlgebra.isIntegrallyClosed_int_of_squarefree_of_emod_four
      file: QuadraticAlgebras/IntegralClosureInt.lean
    - declaration: MvPolynomial.irreducible_sumSMulXSq
      file: QuadraticAlgebras/Diagonal.lean
    - declaration: MvPolynomial.squarefree_sumSMulXSq
      file: QuadraticAlgebras/Diagonal.lean
    - declaration: QuadraticAlgebra.not_uniqueFactorizationMonoid_int_negFive
      file: QuadraticAlgebras/SqrtNegFive.lean
    - declaration: QuadraticAlgebra.classNumber_sqrtNegFiveField
      file: QuadraticAlgebras/ClassNumberNegFive.lean
review:
  status: agent-reviewed mathematical development
  notes: >-
    Mathematical development and the earlier native-module/client assembly
    received independent project review and owner acceptance. These historical
    reviews do not certify later artifacts. Exact assembly review, findings,
    acceptance and publication are recorded separately for each commit and
    tree. Schema validity is not release acceptance, source coverage or
    redistribution clearance.
acknowledgements: >-
  Uses mathlib's quadratic-algebra, polynomial, localization, number-field and
  ideal-class APIs through the declared pinned dependency. Mathematical
  motivation and source-specific correspondence are not imported proof code
  and do not make source authors formalization contributors. The documentation
  adapter retains credit to Anchor's original ideal-completion recipe and
  subsequent Formal Frontier adaptations in docs/README.md.
